[project]
name = "booking-bot"
version = "1.0.0"
description = "Telegram-бот онлайн-записи для барбершопа / салона / студии"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
